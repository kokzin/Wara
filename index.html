<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* {
  box-sizing: border-box;
}

body {
  font-family: "Lucida Sans", sans-serif;
  font-size: 17px;
}

.grid-container {
  display: grid;
  grid-template-areas:
    'header'
    'menu'
    'main'
    'facts'
    'footer';
  background-color: black;
  gap: 10px;  
}

.header {
  grid-area: header;
  background-color: #023e8a;
  text-align: center;
  color: #ffffff;
}

.header > h1 {
  font-size: 40px;
}
div.gallery {
  border: 1px solid #ccc;
}

div.gallery:hover {
  border: 1px solid #777;
}

div.gallery img {
  width: 100%;
  height: auto;
}

div.desc {
  padding: 15px;
  text-align: center;
  color: white;
}

* {
  box-sizing: border-box;
}

.responsive {
  padding: 0 6px;
  float: left;
  width: 24.99999%;
}

@media only screen and (max-width: 700px) {
  .responsive {
    width: 49.99999%;
    margin: 6px 0;
  }
}

@media only screen and (max-width: 500px) {
  .responsive {
    width: 100%;
  }
}

.clearfix:after {
  content: "";
  display: table;
  clear: both;
}

.menu {
  grid-area: menu;
  }
  
.menu ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
}

.menu li {
  padding: 8px;
  margin-bottom: 7px;
  background-color: #33b5e5;
  color: #ffffff;
}

.menu li:hover {
  background-color: #0099cc;
}
  
.content {
  grid-area: main;
}

.content > h1 {
  font-size: 30px;
  margin-bottom: 7px;
}

.content > p {
  margin-bottom: 7px;
}

.facts {
  grid-area: facts;
  border: 1px solid #0099cc;
  background-color: beige;
  padding: 10px;
}

.facts > h2 {
  font-size: 20px;
}

.facts li {
  margin-bottom: 5px;
}

.footer {
  grid-area: footer;
  background-color: #0099cc;
  color: #ffffff;
  text-align: center;
}

@media (min-width: 600px) {
  .header {grid-area: 1 / span 6;}
  .menu {grid-area: 2 / span 1;}
  .content {grid-area: 2 / span 4;}
  .facts {grid-area: 3 / span 6;}
  .footer {grid-area: 4 / span 6;}
}

@media (min-width: 768px) {
  .header {grid-area: 1 / span 6;}
  .menu {grid-area: 2 / span 1;}
  .content {grid-area: 2 / span 4;}
  .facts {grid-area: 2 / span 1;}
  .footer {grid-area: 3 / span 6;}
}
</style>
</head>
<body>

<div class="grid-container">

<div class="header"><h1>MAWANDA DSTV LOGOS</h1></div>


<div class="content">
<div class="responsive">
  <div class="gallery">
    
      <img src="img/1.png">
  
    <div class="desc">LOGO 1</div>
  </div>
</div>

<div class="responsive">
  <div class="gallery">
    
     <img src="img/2.png">
  
    <div class="desc">LOGO 2</div>
  </div>
</div>
  <div class="responsive">
  <div class="gallery">
    
     <img src="img/3.png">
  
    <div class="desc">LOGO 3</div>
  </div>
</div>
  <div class="responsive">
  <div class="gallery">
    
      <img src="img/4.png">
  
    <div class="desc">LOGO 4</div>
  </div>
</div>

  <div class="gallery">
    
      <img src="img/display.png">
  
    <div class="desc">LOGO 4</div>
  </div>
</div>
  
</div>

    

  
  
<div class="clearfix"></div>
</div>  



<div class="footer"><p>Koula's Media Projects</p></div>
  
</div>

</body>
</html>
